server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # HTML 与 SPA 路由一律重新验证，避免部署后返回访客命中旧 index.html；
  # 带内容哈希的 /assets/ 构建产物可以永久缓存。
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # 示例源码包（.lcpppkg）同源反代：R2 下载域不返回 CORS 头，
  # 官网 /demos 的「源码预览」需要同源拉取 zip。只读代理，仅限 uploads 前缀。
  location /uploads/ {
    proxy_pass https://msimgimg.xyz/uploads/;
    proxy_ssl_server_name on;
    proxy_set_header Host msimgimg.xyz;
    proxy_set_header accept-encoding "";
    add_header Cache-Control "public, max-age=3600";
  }
  location /health { add_header Content-Type text/plain; return 200 'ok
'; }
}
